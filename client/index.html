<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Sesli Görüşme</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        background: #f9f9f9;
        text-align: center;
        padding-top: 60px;
      }

      h1 {
        color: #333;
        margin-bottom: 30px;
      }

      button {
        margin: 10px;
        padding: 12px 24px;
        font-size: 16px;
        background-color: #0066cc;
        border: none;
        color: white;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.3s ease;
      }

      button:hover {
        background-color: #004999;
      }

      button:disabled {
        background-color: #ccc;
        cursor: not-allowed;
      }

      #status {
        margin-top: 20px;
        font-weight: bold;
        color: green;
      }

      .error {
        color: red !important;
      }
    </style>
  </head>
  <body>
    <h2>Sesli Görüşme</h2>

    <input type="text" id="usernameInput" placeholder="Kullanıcı adınız" />
    <button id="joinBtn">Giriş Yap</button>

    <h3>Aktif Kullanıcılar</h3>
    <ul id="userList"></ul>

    <select id="targetUser"></select>
    <button id="startCall" disabled>Çağrı Başlat</button>
    <button id="cancelCall" disabled>Çağrıyı İptal Et</button>
    <button id="endCall" disabled>Sonlandır</button>

    <div id="incomingCall" style="display: none">
      <p>Gelen çağrı var!</p>
      <button id="acceptCall">Kabul Et</button>
    </div>

    <p id="status">Durum: Bekleniyor...</p>
    <script src="renderer.js"></script>
  </body>
</html>
