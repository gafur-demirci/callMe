<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Sesli Görüşme</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        background: #f9f9f9;
        text-align: center;
        padding-top: 60px;
      }

      h1 {
        color: #333;
        margin-bottom: 30px;
      }

      button {
        margin: 10px;
        padding: 12px 24px;
        font-size: 16px;
        background-color: #0066cc;
        border: none;
        color: white;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.3s ease;
      }

      button:hover {
        background-color: #004999;
      }

      button:disabled {
        background-color: #ccc;
        cursor: not-allowed;
      }

      #status {
        margin-top: 20px;
        font-weight: bold;
        color: green;
      }

      .error {
        color: red !important;
      }
    </style>
  </head>
  <body>
    <h1>Sesli Görüşme Uygulaması</h1>
    <button id="startCall">Çağrı Başlat</button>
    <button id="acceptCall">Gelen Çağrıyı Kabul Et</button>
    <button id="endCall">Görüşmeyi Bitir</button>
    <p id="status">Durum: Mikrofon kontrol ediliyor...</p>
    <button id="test">Test</button>
    <script src="renderer.js">
      // const testBtn = document.getElementById("test");
      // testBtn.addEventListener("click", () => {
      //   console.log("Test butonuna tıklandı");
      // });
    </script>
  </body>
</html>
